# Pings the Render free-tier API so it doesn't spin down after ~15 min of inactivity.
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 15 --max-time 60 \
            https://attendance-fines.onrender.com/api/health
